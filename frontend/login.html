<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Glow</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<header id="site-header" class="site-header"></header>
<main id="contenido" class="container narrow">
  <h1>Iniciar sesión</h1>
  <form id="login-form" class="form" novalidate>
    <label>Correo electrónico
      <input name="email" type="email" maxlength="120" autocomplete="email">
      <small class="err" data-err-for="email"></small>
    </label>
    <label>Contraseña
      <input name="password" type="password" maxlength="72" autocomplete="current-password">
      <small class="err" data-err-for="password"></small>
    </label>
    <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
    <p class="muted">¿Aún no tienes cuenta? <a href="/registro.html">Crear cuenta</a></p>
  </form>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
